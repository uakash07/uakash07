<svg fill="none" viewBox="0 0 860 220" width="860" height="220" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    width: 860px;
    height: 220px;
    background: linear-gradient(135deg, #0d0d1a 0%, #0a0a2e 40%, #0d1b2a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  /* Animated grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(112,165,253,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(112,165,253,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 8s linear infinite;
  }
  @keyframes gridScroll {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  /* Glowing orbs */
  .orb1 {
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(112,165,253,0.18) 0%, transparent 70%);
    top: -80px; left: -60px;
    animation: pulse 4s ease-in-out infinite;
  }
  .orb2 {
    position: absolute;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(191,145,243,0.15) 0%, transparent 70%);
    bottom: -70px; right: -40px;
    animation: pulse 4s ease-in-out infinite 2s;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50%       { transform: scale(1.15); opacity: 1; }
  }

  /* Floating particles */
  .p { position: absolute; border-radius: 50%; animation: float linear infinite; }
  .p1 { width:3px;height:3px; background:#70A5FD; left:8%;  top:20%; animation-duration:6s;  animation-delay:0s; }
  .p2 { width:2px;height:2px; background:#BF91F3; left:18%; top:70%; animation-duration:8s;  animation-delay:1s; }
  .p3 { width:3px;height:3px; background:#70A5FD; left:82%; top:15%; animation-duration:7s;  animation-delay:2s; }
  .p4 { width:2px;height:2px; background:#BF91F3; left:91%; top:65%; animation-duration:5s;  animation-delay:0.5s; }
  .p5 { width:2px;height:2px; background:#70A5FD; left:45%; top:10%; animation-duration:9s;  animation-delay:3s; }
  .p6 { width:3px;height:3px; background:#BF91F3; left:65%; top:80%; animation-duration:6s;  animation-delay:1.5s; }
  @keyframes float {
    0%   { transform: translateY(0px) scale(1); opacity: 0.6; }
    50%  { transform: translateY(-18px) scale(1.3); opacity: 1; }
    100% { transform: translateY(0px) scale(1); opacity: 0.6; }
  }

  /* Scanline overlay */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  .content { position: relative; z-index: 2; text-align: center; }

  /* Terminal prefix line */
  .prefix {
    font-size: 12px;
    color: #70A5FD;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeSlideDown 0.6s ease forwards 0.3s;
  }
  .cursor-blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Main name */
  .name {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 10px;
    background: linear-gradient(90deg, #70A5FD 0%, #ffffff 40%, #BF91F3 80%, #70A5FD 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite, fadeSlideDown 0.8s ease forwards 0.6s;
    opacity: 0;
  }
  @keyframes shimmer {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* Accent underline */
  .underline {
    height: 2px;
    width: 0;
    background: linear-gradient(90deg, #70A5FD, #BF91F3);
    margin: 10px auto;
    border-radius: 2px;
    animation: expand 0.8s ease forwards 1.2s;
  }
  @keyframes expand { to { width: 320px; } }

  /* Tagline */
  .tagline {
    font-size: 13px;
    color: #8ab4f8;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeSlideDown 0.6s ease forwards 1.4s;
  }

  /* Chip badges */
  .chips {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    opacity: 0;
    animation: fadeSlideDown 0.6s ease forwards 1.7s;
  }
  .chip {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
    border: 1px solid;
  }
  .chip-blue   { color: #70A5FD; border-color: rgba(112,165,253,0.4); background: rgba(112,165,253,0.08); }
  .chip-purple { color: #BF91F3; border-color: rgba(191,145,243,0.4); background: rgba(191,145,243,0.08); }
  .chip-green  { color: #6ee7b7; border-color: rgba(110,231,183,0.4); background: rgba(110,231,183,0.08); }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="banner">
  <div class="grid"></div>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="p p1"></div><div class="p p2"></div><div class="p p3"></div>
  <div class="p p4"></div><div class="p p5"></div><div class="p p6"></div>
  <div class="scanlines"></div>

  <div class="content">
    <div class="prefix">&gt;_ init profile.py <span class="cursor-blink">|</span></div>
    <div class="name">AKASH U</div>
    <div class="underline"></div>
    <div class="tagline">AI &amp; Data Science Engineer &nbsp;·&nbsp; Chennai, India</div>
    <div class="chips">
      <span class="chip chip-blue">Python</span>
      <span class="chip chip-purple">Machine Learning</span>
      <span class="chip chip-green">FastF1</span>
      <span class="chip chip-blue">GenAI</span>
      <span class="chip chip-purple">FastAPI</span>
    </div>
  </div>
</div>
</div>
</foreignObject>
</svg>
