<svg viewBox="0 0 860 200" width="860" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated deep dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="50%"  stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Shimmer gradient for the name text -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#70A5FD">
        <animate attributeName="stop-color"
          values="#70A5FD;#BF91F3;#ffffff;#70A5FD"
          dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#ffffff">
        <animate attributeName="stop-color"
          values="#ffffff;#70A5FD;#BF91F3;#ffffff"
          dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#BF91F3">
        <animate attributeName="stop-color"
          values="#BF91F3;#ffffff;#70A5FD;#BF91F3"
          dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for orbs -->
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="url(#bgGrad)"/>

  <!-- Moving grid lines - horizontal -->
  <line x1="0" y1="40"  x2="860" y2="40"  stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="0" y1="80"  x2="860" y2="80"  stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="0" y1="120" x2="860" y2="120" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="0" y1="160" x2="860" y2="160" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>

  <!-- Moving grid lines - vertical -->
  <line x1="107" y1="0" x2="107" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="215" y1="0" x2="215" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="322" y1="0" x2="322" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="430" y1="0" x2="430" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="537" y1="0" x2="537" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="645" y1="0" x2="645" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="752" y1="0" x2="752" y2="200" stroke="#70A5FD" stroke-width="0.3" stroke-opacity="0.12"/>

  <!-- Glowing orb - top left, pulsing -->
  <circle cx="80" cy="60" r="70" fill="#70A5FD" fill-opacity="0.07" filter="url(#softglow)">
    <animate attributeName="r" values="70;90;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.07;0.14;0.07" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Glowing orb - bottom right, pulsing (offset) -->
  <circle cx="780" cy="150" r="80" fill="#BF91F3" fill-opacity="0.07" filter="url(#softglow)">
    <animate attributeName="r" values="80;60;80" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.07;0.13;0.07" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="100" cy="30" r="2.5" fill="#70A5FD" fill-opacity="0.7">
    <animate attributeName="cy" values="30;18;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="170" r="2" fill="#BF91F3" fill-opacity="0.6">
    <animate attributeName="cy" values="170;158;170" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="25" r="2.5" fill="#70A5FD" fill-opacity="0.7">
    <animate attributeName="cy" values="25;13;25" dur="5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="40" r="2" fill="#BF91F3" fill-opacity="0.6">
    <animate attributeName="cy" values="40;28;40" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="185" r="2" fill="#6ee7b7" fill-opacity="0.5">
    <animate attributeName="cy" values="185;173;185" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="4.5s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="20" r="1.5" fill="#70A5FD" fill-opacity="0.5">
    <animate attributeName="cy" values="20;10;20" dur="6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="175" r="2" fill="#BF91F3" fill-opacity="0.5">
    <animate attributeName="cy" values="175;165;175" dur="3.8s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Wave bottom -->
  <path d="M0,175 C120,155 220,190 360,168 C500,146 640,182 780,162 L860,158 L860,200 L0,200 Z"
    fill="#70A5FD" fill-opacity="0.09">
    <animate attributeName="d"
      values="M0,175 C120,155 220,190 360,168 C500,146 640,182 780,162 L860,158 L860,200 L0,200 Z;
              M0,168 C140,188 240,152 380,174 C520,196 660,158 800,172 L860,170 L860,200 L0,200 Z;
              M0,175 C120,155 220,190 360,168 C500,146 640,182 780,162 L860,158 L860,200 L0,200 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M0,185 C100,170 250,195 420,178 C590,161 720,190 860,175 L860,200 L0,200 Z"
    fill="#BF91F3" fill-opacity="0.07">
    <animate attributeName="d"
      values="M0,185 C100,170 250,195 420,178 C590,161 720,190 860,175 L860,200 L0,200 Z;
              M0,178 C130,193 280,168 440,185 C600,202 730,175 860,182 L860,200 L0,200 Z;
              M0,185 C100,170 250,195 420,178 C590,161 720,190 860,175 L860,200 L0,200 Z"
      dur="5s" begin="1s" repeatCount="indefinite"/>
  </path>

  <!-- Terminal prefix -->
  <text x="430" y="62" text-anchor="middle"
    font-family="Courier New, Courier, monospace"
    font-size="12" letter-spacing="4" fill="#6ee7b7" fill-opacity="0.9">
    &gt;_ init profile.py
    <animate attributeName="fill-opacity" values="0.9;0.4;0.9" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- Main name with shimmer gradient -->
  <text x="430" y="116" text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="58" font-weight="900" letter-spacing="12"
    fill="url(#nameGrad)" filter="url(#glow)">
    AKASH U
  </text>

  <!-- Animated underline -->
  <line x1="280" y1="130" x2="580" y2="130" stroke="url(#nameGrad)" stroke-width="1.5" stroke-opacity="0.6">
    <animate attributeName="x1" values="430;280;430" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="430;580;430" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Tagline -->
  <text x="430" y="152" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13" letter-spacing="3" fill="#8ab4f8" fill-opacity="0.85">
    AI &amp; DATA SCIENCE ENGINEER  ·  CHENNAI, INDIA
  </text>

  <!-- Chip badges -->
  <!-- Python chip -->
  <rect x="178" y="163" width="72" height="20" rx="10" fill="#70A5FD" fill-opacity="0.12" stroke="#70A5FD" stroke-opacity="0.4" stroke-width="1"/>
  <text x="214" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#70A5FD">Python</text>

  <!-- ML chip -->
  <rect x="258" y="163" width="116" height="20" rx="10" fill="#BF91F3" fill-opacity="0.12" stroke="#BF91F3" stroke-opacity="0.4" stroke-width="1"/>
  <text x="316" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#BF91F3">Machine Learning</text>

  <!-- F1 chip -->
  <rect x="382" y="163" width="58" height="20" rx="10" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="411" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#6ee7b7">FastF1</text>

  <!-- GenAI chip -->
  <rect x="448" y="163" width="58" height="20" rx="10" fill="#70A5FD" fill-opacity="0.12" stroke="#70A5FD" stroke-opacity="0.4" stroke-width="1"/>
  <text x="477" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#70A5FD">GenAI</text>

  <!-- FastAPI chip -->
  <rect x="514" y="163" width="68" height="20" rx="10" fill="#BF91F3" fill-opacity="0.12" stroke="#BF91F3" stroke-opacity="0.4" stroke-width="1"/>
  <text x="548" y="177" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#BF91F3">FastAPI</text>
</svg>
