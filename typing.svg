<svg fill="none" viewBox="0 0 860 70" width="860" height="70" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .term {
    width: 860px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .typing-wrap {
    font-family: 'Courier New', Courier, monospace;
    font-size: 18px;
    font-weight: 700;
    color: #70A5FD;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .prompt { color: #6ee7b7; margin-right: 2px; }

  /* Each line fades in and types, then fades out in sequence */
  .line {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    opacity: 0;
  }

  /* Line 1 */
  .l1 { animation: type1 2s steps(40,end) 0.5s forwards, fadeout 0.3s ease 5s forwards; color: #70A5FD; }
  /* Line 2 */
  .l2 { animation: type1 2s steps(40,end) 5.5s forwards, fadeout 0.3s ease 10s forwards; color: #BF91F3; position:absolute; }
  /* Line 3 */
  .l3 { animation: type1 2s steps(40,end) 10.5s forwards, fadeout 0.3s ease 15s forwards; color: #6ee7b7; position:absolute; }
  /* Line 4 — loops back */
  .l4 { animation: type1 2s steps(40,end) 15.5s forwards, fadeout 0.3s ease 20s forwards; color: #f9a8d4; position:absolute; }

  @keyframes type1 {
    0%   { width:0; opacity:1; }
    100% { width:520px; opacity:1; }
  }
  @keyframes fadeout {
    to { opacity:0; width:0; }
  }

  .cursor {
    display: inline-block;
    width: 10px; height: 18px;
    background: #70A5FD;
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .lines-container { position: relative; height: 26px; display:flex; align-items:center; }
</style>
<div class="term">
  <div class="typing-wrap">
    <span class="prompt">$</span>
    <div class="lines-container">
      <span class="line l1">AI &amp; Data Science Engineer | IIT Madras Intern 🏛️</span>
      <span class="line l2">F1 Telemetry · EV Analytics · ML Pipelines 🏎️</span>
      <span class="line l3">Python · FastAPI · React · GenAI APIs 🤖</span>
      <span class="line l4">Turning Raw Data into Real Decisions 🚀</span>
    </div>
    <span class="cursor"></span>
  </div>
</div>
</div>
</foreignObject>
</svg>
